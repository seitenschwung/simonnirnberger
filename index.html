<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="Simon Ernst Nirnberger – Zeichnung und Malerei">
  <title>Simon Ernst Nirnberger</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body>
  <!-- Static blob: shown until WebGL draws its first frame, and instead of it
       when WebGL is missing (or JavaScript is off). -->
  <div class="fallback" aria-hidden="true">
    <svg viewBox="0 0 100 100"><path d="M52 4c17 1 33 10 40 26s4 37-7 50-29 19-46 15S7 79 4 61 6 25 19 14 35 3 52 4z" /></svg>
  </div>
  <canvas id="scene" aria-hidden="true"></canvas>

  <h1 class="name" aria-label="Simon Ernst Nirnberger">
    <span class="line line--big" aria-hidden="true">Sim<span class="o">o<svg class="eyes" viewBox="0 0 44 22" aria-hidden="true">
      <g class="eyes__lids">
        <circle class="eyes__ball" cx="11" cy="11" r="8.5" />
        <circle class="eyes__ball" cx="33" cy="11" r="8.5" />
        <g class="eyes__pupils">
          <circle class="eyes__pupil" cx="11" cy="11" r="3.6" />
          <circle class="eyes__pupil" cx="33" cy="11" r="3.6" />
        </g>
      </g>
    </svg></span>n</span>
    <span class="line line--small" aria-hidden="true">Ernst</span>
    <span class="line line--big" aria-hidden="true">Nirnberger</span>
  </h1>

  <footer class="labels">
    <p class="label">Zeichnung und Malerei</p>
    <a class="link" href="#werke">Zu den Werken ↓</a>
  </footer>

  <p class="coda">Werke folgen.</p>

  <!-- Nur Scroll-Strecke; der Inhalt ist die Animation. -->
  <main>
    <div id="werke" class="anchor"></div>
  </main>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
