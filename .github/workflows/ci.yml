name: CI & Deploy

# Every push and pull request: build the page, build the image and test it in the hardened container.
# On main additionally: publish exactly that image and deploy it to Coolify.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: simonnirnberger:ci

jobs:
  site:
    name: Seite bauen
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: No requests to other hosts (the CSP allows only 'self')
        run: |
          if grep -rEo 'https?://[a-zA-Z0-9.-]+' dist/index.html dist/assets/*.css | grep -v 'www.w3.org'; then
            echo "::error::External URL in the built page"; exit 1
          fi

  docker:
    name: Docker-Image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build
        run: docker build --build-arg APP_VERSION="${GITHUB_SHA}" -t "$IMAGE" .
      # Same limits as docker-compose.yml: read-only, no capabilities, nginx as UID 101.
      - name: Start hardened
        run: |
          docker run -d --name web --user 101:101 --read-only \
            --tmpfs /tmp:size=16m,mode=1777,noexec,nosuid,nodev \
            --cap-drop ALL --security-opt no-new-privileges:true --pids-limit 100 --memory 128m \
            -p 8080:8080 "$IMAGE"
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/healthz > /dev/null && exit 0; sleep 1; done
          docker logs web; exit 1
      - name: Test
        run: |
          set -e
          base=http://127.0.0.1:8080
          curl -fsS "$base/" | grep -q '<title>Simon Ernst Nirnberger</title>'
          [ "$(curl -fsS "$base/version.txt")" = "${GITHUB_SHA}" ]
          [ "$(curl -s -o /dev/null -w '%{http_code}' "$base/gibt-es-nicht")" = 404 ]
          curl -fsSI "$base/" | grep -qi "^content-security-policy: default-src 'self'"
          for asset in $(curl -fsS "$base/" | grep -o '/assets/[^"]*' | sort -u); do
            curl -fsS -o /dev/null "$base$asset" && echo "ok $asset"
          done
          [ "$(docker exec web id -u)" = 101 ]
      - name: Container logs
        if: always()
        run: docker logs web 2>&1 | tail -50
      # Exactly this tested image goes to production.
      - name: Hand the tested image to the publish job
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save "$IMAGE" | gzip > image.tar.gz
      - uses: actions/upload-artifact@v4
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: tested-image
          path: image.tar.gz
          retention-days: 1

  # Only on main and only after every check: pushes the tested image (not a rebuild) to the GitHub
  # container registry, tagged with its commit. The only job with write access to the registry,
  # and it runs no code from the repository.
  publish:
    name: Image veröffentlichen
    needs: [site, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tested-image
      - name: Push it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gunzip -c image.tar.gz | docker load
          image="ghcr.io/$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')/simonnirnberger"
          echo "$GH_TOKEN" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          for tag in "${GITHUB_SHA}" main; do
            docker tag "$IMAGE" "${image}:${tag}"
            docker push -q "${image}:${tag}"
          done
          docker logout ghcr.io
          echo "Published ${image}:${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy (Coolify)
    # Only code that passed every check, only from main.
    needs: [publish]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Secrets and variables live in the GitHub environment "production"
    # (Settings → Environments), where a required reviewer can be added as well.
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    # Secrets only reach the shell as environment variables, never pasted into the script.
    # The UUID and URLs aren't confidential; they may be stored as a variable or a secret
    # (repository or "production" environment) – whichever exists is used.
    env:
      COOLIFY_URL: ${{ secrets.COOLIFY_URL || vars.COOLIFY_URL }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      COOLIFY_APP_UUID: ${{ vars.COOLIFY_APP_UUID || secrets.COOLIFY_APP_UUID }}
      APP_URL: ${{ vars.APP_URL || secrets.APP_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
          persist-credentials: false

      - name: Check configuration
        run: |
          missing=0
          for name in COOLIFY_URL COOLIFY_TOKEN COOLIFY_APP_UUID APP_URL; do
            if [ -z "${!name}" ]; then echo "::error::$name is not set (Settings → Secrets and variables → Actions, as a secret or variable of the repository or the production environment)"; missing=1; fi
          done
          exit $missing

      # v4 brings a current Tailscale client (v3 used 1.82, which failed with "404 not found")
      # and fails the step when joining doesn't work. Pinned to the commit of the v4.2.0 tag.
      - name: Join tailnet
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Check tailnet connection
        run: |
          if ! tailscale status --json | jq -e '.BackendState == "Running"' > /dev/null; then
            echo "::error::Not connected to the tailnet. In the Tailscale admin console check: the OAuth client (trust credential) has the writable auth_keys scope and the tag tag:ci; tag:ci is listed under tagOwners in the access policy; TS_OAUTH_CLIENT_ID / TS_OAUTH_SECRET are that client's ID and secret (tskey-client-…)."
            exit 1
          fi
          host="$(echo "${COOLIFY_URL}" | sed -E 's#^https?://##; s#[:/].*$##')"
          if ! getent hosts "$host" > /dev/null; then
            echo "::error::Connected, but $host does not resolve. Is MagicDNS enabled, and may tag:ci reach the VPS in the access policy?"
            exit 1
          fi
          echo "Tailnet OK, $host resolves."

      - name: Check Coolify is reachable
        run: |
          for i in 1 2 3 4 5; do
            curl -sS --fail --max-time 15 "${COOLIFY_URL%/}/api/health" && exit 0
            echo "Coolify not reachable yet (attempt $i), retrying …"; sleep 5
          done
          exit 1

      # What runs now – the version an automatic rollback returns to.
      - name: Note the running version
        id: before
        run: |
          # Only hex digits from the server's answer reach the log (no smuggled workflow commands).
          version="$(curl -sS --max-time 15 "${APP_URL%/}/version.txt" | tr -cd '0-9a-f' | head -c 40 || true)"
          if [[ "$version" =~ ^[0-9a-f]{40}$ ]]; then
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "Running before the deployment: $version"
          else
            echo "::warning::The running build reports no commit, so a failed deployment can't be rolled back automatically this time."
          fi

      - name: Deploy the tested image
        id: deploy
        run: scripts/coolify-deploy.sh "${GITHUB_SHA}"

      # The new version failed to deploy or to answer correctly: put the previous one back.
      # The job stays red either way.
      - name: Roll back to the previous version
        if: failure() && steps.deploy.outcome == 'failure' && steps.before.outputs.version != '' && steps.before.outputs.version != github.sha
        env:
          PREVIOUS: ${{ steps.before.outputs.version }}
        run: |
          echo "::warning::Rolling back to ${PREVIOUS}"
          echo "### ⚠️ Rolled back to \`${PREVIOUS:0:12}\`" >> "$GITHUB_STEP_SUMMARY"
          scripts/coolify-deploy.sh "${PREVIOUS}"
