# Für Coolify: Build Pack "Docker Compose" wählen und die Domain dem Service "web"
# mit Port 8080 zuweisen (https://…:8080). Coolify übernimmt TLS & Routing.
services:
  web:
    # Coolify baut nicht selbst: Die Pipeline baut und testet das Image, legt es in die
    # GitHub-Registry und setzt vor jedem Deploy IMAGE_TAG (Umgebungsvariable in Coolify).
    image: ghcr.io/seitenschwung/simonnirnberger:${IMAGE_TAG:-main}
    restart: unless-stopped
    expose:
      - "8080"
    user: "101:101"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 128m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
