server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Keine nginx-Version in Headern und Fehlerseiten verraten.
    server_tokens off;

    # TLS terminiert Coolifys Proxy (Traefik/Caddy); hier nur HTTP intern.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Healthcheck für Docker/Coolify, ohne Access-Log.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # /dreamcast ohne Endung (Datei: dreamcast.html). Relative Weiterleitung, damit der
    # interne Port 8080 nicht in der Adresse landet.
    location = /dreamcast {
        try_files /dreamcast.html =404;
    }
    location = /dreamcast/ {
        absolute_redirect off;
        return 301 /dreamcast;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Bilder eine Woche cachen (ein ersetztes Werk bekommt einen neuen Dateinamen).
    # Kein add_header hier, sonst entfallen die Security-Header von oben
    # (nginx vererbt sie dann nicht); "expires" setzt Cache-Control selbst.
    location ~* \.(?:woff2?|png|jpe?g|gif|svg|webp|avif|ico)$ {
        expires 7d;
        try_files $uri =404;
    }

    # CSS, JavaScript und Daten haben keine Versionsnummer im Namen: bei jedem
    # Aufruf kurz nachfragen (ETag), damit nach einem Deploy niemand alte Dateien sieht.
    location ~* \.(?:css|js|mjs|json)$ {
        expires -1;
        try_files $uri =404;
    }

    # Versteckte Dateien (.git, .env, ...) nie ausliefern.
    location ~ /\. {
        return 404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
